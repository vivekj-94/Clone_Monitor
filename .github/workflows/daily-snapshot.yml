name: Daily snapshot

# Once a day: copy the latest koala73/worldmonitor into worldmonitor/, build
# it, run its self-hosted backend and seeders inside the runner, record what
# the dashboard loads, and publish the frozen result to GitHub Pages.
# See README.md. The pipeline itself is snapshot/build.sh.
#
# Privilege split: only `sync` can write to this repository and it never runs
# upstream code (git archive + tar). `snapshot` runs upstream code (npm
# install scripts, seeders, the build) with a read-only token that is not left
# in the checkout. `deploy` only publishes the artifact `snapshot` produced.
#
# If the newest upstream code fails to build, record or verify, `snapshot`
# rebuilds the code of the snapshot currently online (its status.json names
# the commit) with fresh data, so the page keeps refreshing daily.

on:
  schedule:
    # 05:23 UTC daily. Off the hour: GitHub queues on-the-hour crons late.
    - cron: '23 5 * * *'
  workflow_dispatch:
    inputs:
      sync_upstream:
        description: Pull the latest koala73/worldmonitor before building
        type: boolean
        default: true

permissions: {}

concurrency:
  group: daily-snapshot
  cancel-in-progress: false

jobs:
  sync:
    name: Sync upstream code
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      ref: ${{ steps.head.outputs.ref }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 1

      - name: Copy koala73/worldmonitor into worldmonitor/
        if: github.event_name == 'schedule' || inputs.sync_upstream
        env:
          UPSTREAM: https://github.com/koala73/worldmonitor.git
        run: |
          set -euo pipefail
          git clone --quiet --depth 1 "$UPSTREAM" "$RUNNER_TEMP/upstream"
          sha="$(git -C "$RUNNER_TEMP/upstream" rev-parse HEAD)"
          # Exactly upstream's tracked files; upstream's own .github/ lands
          # inside worldmonitor/, where GitHub never runs it.
          rm -rf worldmonitor
          mkdir worldmonitor
          git -C "$RUNNER_TEMP/upstream" archive --format=tar HEAD | tar -x -C worldmonitor
          echo "$sha" > worldmonitor.upstream-sha
          git add -A -f worldmonitor worldmonitor.upstream-sha
          if git diff --cached --quiet; then
            echo "Already at koala73/worldmonitor@${sha:0:7}" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            git -c user.name='github-actions[bot]' \
                -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
                commit --quiet -m "Sync koala73/worldmonitor@${sha:0:7}"
            git push --quiet
            echo "Synced to koala73/worldmonitor@${sha:0:7}" | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - id: head
        run: echo "ref=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  snapshot:
    name: Build and record snapshot
    needs: sync
    # A failed upstream sync must not stop the daily data refresh: build the
    # code already in the repository instead.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
    env:
      SKIP_INSTALL: '1'
      # Project sites live under /<repo>/; a <user>.github.io repo or a
      # custom domain is served from "/" (set SITE_BASE / SITE_ORIGIN
      # repository variables to override). Defaults are filled in below.
      SITE_BASE: ${{ vars.SITE_BASE }}
      SITE_ORIGIN: ${{ vars.SITE_ORIGIN }}
      SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}
      # Data-source keys are given only to the build steps, and hidden from
      # npm install scripts there.
      CM_KEY_NAMES: >-
        FRED_API_KEY EIA_API_KEY FINNHUB_API_KEY NASA_FIRMS_API_KEY ALPHA_VANTAGE_API_KEY
        AVIATIONSTACK_API WAQI_API_KEY OPENROUTER_API_KEY
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.sync.outputs.ref || github.sha }}
          persist-credentials: false

      # The snapshot must never use World Monitor's hosted service: its EULA
      # forbids redistributing that data, and a few upstream scripts call it
      # with a worldmonitor.app Origin. Resolve every worldmonitor.app
      # hostname the code references to nowhere for the rest of this job.
      - name: Block World Monitor's hosted services
        run: |
          for h in worldmonitor.app www api proxy maps abacus clerk status analytics-canary \
                   tech finance commodity happy energy; do
            [ "$h" = worldmonitor.app ] && host=$h || host="$h.worldmonitor.app"
            printf '0.0.0.0 %s\n:: %s\n' "$host" "$host"
          done | sudo tee -a /etc/hosts >/dev/null
          if curl -s -m 5 -o /dev/null https://api.worldmonitor.app/; then
            echo "api.worldmonitor.app is still reachable" >&2; exit 1
          fi
          repo="${GITHUB_REPOSITORY#*/}"
          if [ -z "$SITE_BASE" ]; then
            case "$repo" in *.github.io) SITE_BASE=/ ;; *) SITE_BASE="/$repo/" ;; esac
          fi
          {
            echo "SITE_BASE=$SITE_BASE"
            echo "SITE_ORIGIN=${SITE_ORIGIN:-https://${GITHUB_REPOSITORY_OWNER,,}.github.io}"
            echo "WORK=$RUNNER_TEMP/work"
            echo "OUT_SITE=$RUNNER_TEMP/site"
          } >> "$GITHUB_ENV"

      # Upstream controls .nvmrc and the lockfile; if they break, fall back
      # to Node 24 so the last-good rebuild below can still run.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        id: node
        continue-on-error: true
        with:
          node-version-file: worldmonitor/.nvmrc
          cache: npm
          cache-dependency-path: worldmonitor/package-lock.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.node.outcome != 'success'
        with:
          node-version: '24'

      - name: Install redis-server
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq redis-server
          sudo systemctl stop redis-server || true

      # Everything that depends on the newest upstream code is in this one
      # step, so any failure (install, build, seed, record, verify) or hang
      # leads to the last-good rebuild instead of a skipped day.
      - name: Install, build, seed, record and verify
        id: latest
        continue-on-error: true
        timeout-minutes: 80
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          NASA_FIRMS_API_KEY: ${{ secrets.NASA_FIRMS_API_KEY }}
          ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
          AVIATIONSTACK_API: ${{ secrets.AVIATIONSTACK_API }}
          WAQI_API_KEY: ${{ secrets.WAQI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC2086
          (unset $CM_KEY_NAMES; cd worldmonitor && npm ci --no-audit --no-fund && npx playwright install --with-deps chromium)
          timeout -k 2m 70m ./snapshot/build.sh

      # ---- fallback: newest upstream code failed; rebuild what is online ----
      - name: Find the code of the snapshot that is online
        id: lastgood
        if: steps.latest.outcome != 'success'
        run: |
          url="${SITE_ORIGIN%/}${SITE_BASE}snapshot/status.json"
          sha="$(curl -sf -m 20 "$url" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const v=JSON.parse(s).repoSha||"";if(/^[0-9a-f]{40}$/.test(v))process.stdout.write(v)}catch{}})' || true)"
          if [ -z "$sha" ]; then
            echo "::error::Latest code failed and no previous snapshot is online to fall back to ($url)."
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "::warning::Latest upstream code failed; rebuilding last-good commit ${sha:0:7} with today's data."

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        if: steps.lastgood.outputs.sha
        with:
          ref: ${{ steps.lastgood.outputs.sha }}
          path: lastgood
          persist-credentials: false

      - name: Install, build, seed, record and verify (last-good code)
        id: fallback
        if: steps.lastgood.outputs.sha
        timeout-minutes: 80
        env:
          REPO_SHA: ${{ steps.lastgood.outputs.sha }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          NASA_FIRMS_API_KEY: ${{ secrets.NASA_FIRMS_API_KEY }}
          ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
          AVIATIONSTACK_API: ${{ secrets.AVIATIONSTACK_API }}
          WAQI_API_KEY: ${{ secrets.WAQI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          set -euo pipefail
          # Keep the failed attempt's (already scrubbed) logs for the artifact.
          if [ -d "$WORK" ]; then
            rm -rf "$RUNNER_TEMP/work-latest" "$WORK/runtime"
            mv "$WORK" "$RUNNER_TEMP/work-latest"
          fi
          # shellcheck disable=SC2086
          (unset $CM_KEY_NAMES; cd lastgood/worldmonitor && npm ci --no-audit --no-fund && npx playwright install --with-deps chromium)
          timeout -k 2m 70m ./lastgood/snapshot/build.sh

      - name: Summary
        if: always()
        env:
          LATEST: ${{ steps.latest.outcome }}
          FALLBACK: ${{ steps.fallback.outcome }}
          LATEST_REF: ${{ needs.sync.outputs.ref }}
          SYNC_RESULT: ${{ needs.sync.result }}
          LASTGOOD: ${{ steps.lastgood.outputs.sha }}
        run: |
          {
            echo '### Snapshot'
            if [ "$LATEST" = success ]; then
              echo "Built from the latest code (${LATEST_REF:-$GITHUB_SHA}; upstream sync ${SYNC_RESULT})."
            elif [ "$FALLBACK" = success ]; then
              echo "**Latest upstream code failed**; published last-good code $LASTGOOD with fresh data."
            else
              echo "**No snapshot published today**; the site keeps the previous one."
            fi
            if [ -f "$OUT_SITE/snapshot/status.json" ]; then
              echo '```json'; cat "$OUT_SITE/snapshot/status.json"; echo '```'
            fi
            if [ -f "$WORK/reports/verify-report.json" ]; then
              node -e 'const r=require(process.argv[1]); console.log(`Replay: ${(r.hitRate*100).toFixed(1)}% of API requests served (${r.shim.hits} exact, ${r.shim.fuzzy} fuzzy, ${r.shim.misses} missed); map: ${r.mapMode}; page errors: ${r.pageErrors.length}`)' "$WORK/reports/verify-report.json"
            fi
            if [ -f "$WORK/reports/seed-summary.tsv" ]; then
              echo; echo '<details><summary>Seeders that failed or timed out</summary>'; echo
              awk -F'\t' '$2=="FAIL" || $2=="TIMEOUT" {printf "- `%s` %s: %s\n", $1, $2, substr($5,1,140)}' "$WORK/reports/seed-summary.tsv"
              echo; echo '</details>'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail if nothing was built
        if: steps.latest.outcome != 'success' && steps.fallback.outcome != 'success'
        run: exit 1

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/site

      - name: Upload reports and logs
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: snapshot-reports
          path: |
            ${{ runner.temp }}/work/reports
            ${{ runner.temp }}/work/logs
            ${{ runner.temp }}/work-latest/reports
            ${{ runner.temp }}/work-latest/logs
          retention-days: 14
          if-no-files-found: ignore

  deploy:
    name: Publish to GitHub Pages
    needs: snapshot
    if: ${{ !cancelled() && needs.snapshot.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
